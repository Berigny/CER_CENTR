[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "evidence-layer"
version = "0.1.0"
description = "evidence/0: portable evidence objects for records kept in other systems (Python binding to the Rust core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Berigny/CER_CENTR"

[tool.maturin]
module-name = "evidence_layer._native"
python-source = "python"
features = ["pyo3/extension-module"]
