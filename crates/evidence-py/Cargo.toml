[package]
name = "evidence-py"
description = "Python binding to the evidence/0 core and the store/0 verifier"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
evidence-core = { path = "../evidence-core" }
evidence-log = { path = "../evidence-log" }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
