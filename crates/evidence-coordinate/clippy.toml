# Purity guard of evidence-coordinate, the same lists as evidence-log's.
#
# The library has no file system, network, process, thread or clock. These
# lists name the items that reach them, so clippy finds a use however it is
# written: a braced import, an alias or a method call. Cargo.toml denies the
# two lints. tests/ reads the vectors from disk and allows them.

disallowed-types = [
    { path = "std::fs::DirBuilder", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::DirEntry", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::File", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::FileTimes", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::FileType", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::Metadata", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::OpenOptions", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::Permissions", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::ReadDir", reason = "evidence-coordinate has no file system" },
    { path = "std::net::TcpListener", reason = "evidence-coordinate has no network" },
    { path = "std::net::TcpStream", reason = "evidence-coordinate has no network" },
    { path = "std::net::UdpSocket", reason = "evidence-coordinate has no network" },
    { path = "std::process::Child", reason = "evidence-coordinate runs no process" },
    { path = "std::process::ChildStderr", reason = "evidence-coordinate runs no process" },
    { path = "std::process::ChildStdin", reason = "evidence-coordinate runs no process" },
    { path = "std::process::ChildStdout", reason = "evidence-coordinate runs no process" },
    { path = "std::process::Command", reason = "evidence-coordinate runs no process" },
    { path = "std::process::Stdio", reason = "evidence-coordinate runs no process" },
    { path = "std::thread::Builder", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::JoinHandle", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::Scope", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::ScopedJoinHandle", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::Thread", reason = "evidence-coordinate has no threads" },
    { path = "std::time::Instant", reason = "evidence-coordinate reads no clock; times are inputs" },
    { path = "std::time::SystemTime", reason = "evidence-coordinate reads no clock; times are inputs" },
]

disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::copy", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::create_dir", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::create_dir_all", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::exists", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::hard_link", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::metadata", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::read", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::read_dir", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::read_link", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::read_to_string", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::remove_dir", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::remove_dir_all", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::remove_file", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::rename", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::set_permissions", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::symlink_metadata", reason = "evidence-coordinate has no file system" },
    { path = "std::fs::write", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::canonicalize", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::exists", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::is_dir", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::is_file", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::is_symlink", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::metadata", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::read_dir", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::read_link", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::symlink_metadata", reason = "evidence-coordinate has no file system" },
    { path = "std::path::Path::try_exists", reason = "evidence-coordinate has no file system" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "evidence-coordinate has no network" },
    { path = "std::process::abort", reason = "evidence-coordinate runs no process" },
    { path = "std::process::exit", reason = "evidence-coordinate runs no process" },
    { path = "std::process::id", reason = "evidence-coordinate runs no process" },
    { path = "std::thread::available_parallelism", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::current", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::park", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::park_timeout", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::scope", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::sleep", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::spawn", reason = "evidence-coordinate has no threads" },
    { path = "std::thread::yield_now", reason = "evidence-coordinate has no threads" },
    # Also through a value whose type is not named, such as UNIX_EPOCH.elapsed().
    { path = "std::time::Instant::elapsed", reason = "evidence-coordinate reads no clock; times are inputs" },
    { path = "std::time::Instant::now", reason = "evidence-coordinate reads no clock; times are inputs" },
    { path = "std::time::SystemTime::elapsed", reason = "evidence-coordinate reads no clock; times are inputs" },
    { path = "std::time::SystemTime::now", reason = "evidence-coordinate reads no clock; times are inputs" },
]
