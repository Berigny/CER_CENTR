[workspace]
resolver = "2"
members = [
    "crates/evidence-core",
    "crates/evidence-log",
    "crates/evidence-coordinate",
    "crates/evidence-store",
    "crates/evidence-cli",
    "crates/evidence-wasm",
    "crates/evidence-py",
]
# The Python extension is built and tested by maturin (see crates/evidence-py),
# not by plain `cargo test`.
default-members = [
    "crates/evidence-core",
    "crates/evidence-log",
    "crates/evidence-coordinate",
    "crates/evidence-store",
    "crates/evidence-cli",
    "crates/evidence-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Berigny/CER_CENTR"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Ed25519 and SHA-256 dominate the store tests in an unoptimised build (the
# property test T5 above all: every attestation and checkpoint is signed,
# then verified at intake and again by every verification). Optimise those
# crates in dev and test builds too; nothing else changes.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
